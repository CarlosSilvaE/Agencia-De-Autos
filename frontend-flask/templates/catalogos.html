{% extends "base.html" %}
{% block content %}
<h1>Catálogos</h1>
<div class="catalog-grid">
  {% for slug, catalog in catalogs.items() %}
  <a class="card catalog-card" href="{{ url_for('catalogos.catalog', catalogo=slug) }}">
    <h2>{{ catalog.title }}</h2>
    <span>Administrar catálogo →</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
